{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} — عقاري {% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}">🏠 عقاري </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold:        #C9A84C;
  --gold-light:  #E8C96A;
  --dark:        #0E1117;
  --dark-2:      #161A22;
  --dark-3:      #1A1F2B;
  --dark-4:      #252A38;
  --text:        #E8E8EC;
  --text-mute:   #8A8A96;
  --text-dim:    #5A5A66;
  --accent:      #4A9EFF;
  --success:     #00A699;
  --warn:        #E8C96A;
  --danger:      #FF5A5F;
  --purple:      #A66DD4;
  --border:      rgba(255,255,255,0.06);
  --border-2:    rgba(255,255,255,0.1);
}

* { box-sizing: border-box; }

body, html {
  font-family: 'Cairo', -apple-system, sans-serif !important;
  background: var(--dark) !important;
  color: var(--text) !important;
  margin: 0;
}

/* ────── HEADER ────── */
#header {
  background: linear-gradient(135deg, var(--dark-2), var(--dark-3)) !important;
  color: var(--text) !important;
  border-bottom: 1px solid var(--border-2);
  padding: 18px 40px !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#site-name a {
  color: var(--gold) !important;
  font-weight: 800 !important;
  font-size: 1.6rem !important;
  text-decoration: none !important;
  letter-spacing: 0.5px;
}
#user-tools { color: var(--text-mute) !important; font-size: 0.9rem; }
#user-tools a {
  color: var(--gold-light) !important;
  text-decoration: none !important;
  padding: 6px 14px !important;
  border-radius: 8px;
  transition: all .2s;
  margin-left: 6px;
}
#user-tools a:hover {
  background: rgba(201,168,76,0.1);
  color: var(--gold) !important;
}

/* ────── BREADCRUMBS ────── */
div.breadcrumbs {
  background: var(--dark-2) !important;
  color: var(--text-mute) !important;
  border-bottom: 1px solid var(--border) !important;
  padding: 12px 40px !important;
  font-size: 0.85rem;
}
div.breadcrumbs a { color: var(--gold) !important; }

/* ────── MAIN CONTENT ────── */
#content {
  background: var(--dark) !important;
  padding: 30px 40px !important;
}
#content-main, #content-related {
  background: transparent !important;
}

/* ────── MODULE / CARDS ────── */
.module {
  background: linear-gradient(135deg, var(--dark-2), var(--dark-3)) !important;
  border: 1px solid var(--border) !important;
  border-radius: 14px !important;
  overflow: hidden;
  margin-bottom: 24px !important;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.module h2, .module caption, .inline-group h2 {
  background: linear-gradient(135deg, var(--dark-3), var(--dark-4)) !important;
  color: var(--gold) !important;
  font-weight: 700 !important;
  font-size: 0.95rem !important;
  padding: 14px 20px !important;
  border-bottom: 1px solid var(--border-2);
  letter-spacing: 0.3px;
  margin: 0 !important;
}
.module table { background: transparent !important; }

/* ────── DASHBOARD (الصفحة الرئيسية) ────── */
.dashboard #content { padding: 30px 40px !important; }

.aqari-stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  margin-bottom: 32px;
}
.aqari-stat {
  background: linear-gradient(135deg, var(--dark-2) 0%, var(--dark-3) 100%);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  position: relative;
  overflow: hidden;
  transition: all .25s ease;
}
.aqari-stat::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 100%; height: 3px;
  background: var(--accent);
}
.aqari-stat:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  border-color: var(--border-2);
}
.aqari-stat.gold::before    { background: var(--gold); }
.aqari-stat.success::before { background: var(--success); }
.aqari-stat.warn::before    { background: var(--warn); }
.aqari-stat.danger::before  { background: var(--danger); }
.aqari-stat.purple::before  { background: var(--purple); }

.aqari-stat .lbl {
  color: var(--text-mute);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.aqari-stat .val {
  color: var(--text);
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1;
}
.aqari-stat .sub {
  color: var(--text-dim);
  font-size: 0.8rem;
  margin-top: 8px;
}
.aqari-stat .icon {
  position: absolute;
  bottom: 12px;
  left: 20px;
  font-size: 2.4rem;
  opacity: 0.12;
}

.aqari-section-title {
  color: var(--gold);
  font-size: 1.15rem;
  font-weight: 700;
  margin: 28px 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-2);
}

.aqari-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
}
.aqari-card {
  background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
}
.aqari-card h3 {
  color: var(--gold-light);
  font-size: 0.95rem;
  margin: 0 0 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
  font-weight: 700;
}
.aqari-card ul { list-style: none; padding: 0; margin: 0; }
.aqari-card li {
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  color: var(--text);
  font-size: 0.88rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.aqari-card li:last-child { border-bottom: none; }
.aqari-card .meta {
  color: var(--text-dim);
  font-size: 0.75rem;
}

/* ────── TABLES ────── */
table { background: transparent !important; border-collapse: separate !important; border-spacing: 0; }
thead th {
  background: linear-gradient(135deg, var(--dark-3), var(--dark-4)) !important;
  color: var(--gold) !important;
  font-weight: 700 !important;
  font-size: 0.82rem !important;
  padding: 14px 14px !important;
  border-bottom: 2px solid var(--border-2) !important;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
thead th a { color: var(--gold) !important; }
tbody tr {
  background: var(--dark-2) !important;
  transition: background .15s;
}
tbody tr:hover { background: var(--dark-3) !important; }
tbody tr.row1 { background: var(--dark-2) !important; }
tbody tr.row2 { background: rgba(22,26,34,0.6) !important; }
tbody td {
  padding: 14px !important;
  border-bottom: 1px solid var(--border) !important;
  color: var(--text) !important;
  font-size: 0.88rem;
}
tbody td a { color: var(--gold-light) !important; text-decoration: none; }
tbody td a:hover { color: var(--gold) !important; }

/* ────── BUTTONS ────── */
.button, input[type=submit], input[type=button], .submit-row input, a.button {
  background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important;
  color: #1A1F2B !important;
  border: none !important;
  border-radius: 8px !important;
  padding: 10px 22px !important;
  font-weight: 700 !important;
  font-family: 'Cairo', sans-serif !important;
  cursor: pointer;
  transition: all .2s;
  font-size: 0.88rem !important;
}
.button:hover, input[type=submit]:hover, a.button:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(201,168,76,0.4);
}
.button.default {
  background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important;
  color: #1A1F2B !important;
}
.deletelink {
  background: linear-gradient(135deg, var(--danger), #FF7A7E) !important;
  color: #fff !important;
  padding: 10px 22px !important;
  border-radius: 8px !important;
  font-weight: 700 !important;
}

/* ────── FORMS ────── */
input[type=text], input[type=email], input[type=password], input[type=number],
input[type=url], textarea, select {
  background: var(--dark-3) !important;
  border: 1px solid var(--border-2) !important;
  color: var(--text) !important;
  padding: 10px 14px !important;
  border-radius: 8px !important;
  font-family: 'Cairo', sans-serif !important;
  font-size: 0.9rem !important;
  transition: all .2s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--gold) !important;
  outline: none !important;
  box-shadow: 0 0 0 3px rgba(201,168,76,0.15) !important;
}
label { color: var(--text-mute) !important; font-weight: 600 !important; font-size: 0.85rem; }
.form-row { padding: 14px 20px !important; border-bottom: 1px solid var(--border) !important; }
.help, .help-block { color: var(--text-dim) !important; font-size: 0.8rem; }
fieldset.module h2 { font-size: 0.95rem !important; }

/* ────── FILTERS SIDEBAR ────── */
#changelist-filter {
  background: var(--dark-2) !important;
  border: 1px solid var(--border) !important;
  border-radius: 14px;
  padding: 0;
  overflow: hidden;
}
#changelist-filter h2 {
  background: linear-gradient(135deg, var(--dark-3), var(--dark-4)) !important;
  color: var(--gold) !important;
}
#changelist-filter h3 {
  color: var(--gold-light) !important;
  font-size: 0.85rem;
  padding: 12px 18px 6px;
  border-top: 1px solid var(--border);
  margin: 0;
}
#changelist-filter li.selected a { color: var(--gold) !important; font-weight: 700; }
#changelist-filter a { color: var(--text-mute) !important; padding: 4px 18px; }
#changelist-filter a:hover { color: var(--gold-light) !important; background: var(--dark-3); }

/* ────── SEARCH BAR ────── */
#changelist-search input[type=text] { min-width: 320px; }
#changelist-search input[type=submit] {
  background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important;
}

/* ────── PAGINATOR ────── */
.paginator {
  background: var(--dark-2) !important;
  border-top: 1px solid var(--border) !important;
  padding: 14px 20px !important;
  color: var(--text-mute) !important;
}
.paginator a { color: var(--gold) !important; padding: 4px 10px; border-radius: 6px; }
.paginator a:hover { background: var(--dark-3); }
.paginator .this-page {
  background: var(--gold);
  color: #1A1F2B !important;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 700;
}

/* ────── MESSAGES ────── */
.messagelist { padding: 0; margin: 0 0 20px; list-style: none; }
.messagelist li {
  padding: 14px 20px;
  border-radius: 10px;
  font-weight: 600;
  margin-bottom: 8px;
  background: linear-gradient(135deg, rgba(0,166,153,0.1), rgba(0,166,153,0.05)) !important;
  color: #00A699 !important;
  border: 1px solid rgba(0,166,153,0.2);
}
.messagelist li.error { background: rgba(255,90,95,0.1) !important; color: #FF5A5F !important; border-color: rgba(255,90,95,0.2); }
.messagelist li.warning { background: rgba(232,201,106,0.1) !important; color: #E8C96A !important; border-color: rgba(232,201,106,0.2); }

/* ────── SUBMIT ROW ────── */
.submit-row {
  background: var(--dark-2) !important;
  border: 1px solid var(--border) !important;
  border-radius: 12px;
  padding: 18px 22px !important;
  margin-top: 24px;
}

/* ────── DELETE BAR ────── */
.object-tools a {
  background: linear-gradient(135deg, var(--gold), var(--gold-light)) !important;
  color: #1A1F2B !important;
  border-radius: 8px !important;
  padding: 8px 18px !important;
  font-weight: 700 !important;
}
.object-tools a:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(201,168,76,0.4); }

/* ────── ACTIONS ────── */
#changelist .actions {
  background: var(--dark-2) !important;
  border: 1px solid var(--border) !important;
  border-radius: 10px;
  padding: 14px 18px !important;
  margin-bottom: 16px;
}
#changelist .actions select {
  background: var(--dark-3) !important;
  color: var(--text) !important;
}

/* ────── LINKS ────── */
a:link, a:visited { color: var(--gold-light); }
a:hover { color: var(--gold); }

/* ────── INLINE GROUPS ────── */
.inline-group {
  background: linear-gradient(135deg, var(--dark-2), var(--dark-3)) !important;
  border: 1px solid var(--border) !important;
  border-radius: 14px !important;
  margin-top: 24px !important;
  overflow: hidden;
}

/* ────── DATE / TIME ────── */
.calendar caption, .calendarbox h2 {
  background: var(--dark-3) !important;
  color: var(--gold) !important;
}
.calendar td a { color: var(--text); }
.calendar td.selected a { background: var(--gold); color: #1A1F2B !important; }

/* ────── SELECT2 (when used) ────── */
.select2-container--admin-autocomplete .select2-selection {
  background: var(--dark-3) !important;
  border-color: var(--border-2) !important;
  color: var(--text) !important;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--dark); }
::-webkit-scrollbar-thumb { background: var(--dark-4); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3A3F4A; }
</style>
{% endblock %}

<style>
/* ─── ترقيات Dashboard ─── */
.welcome-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
  border: 1px solid var(--border-2);
  border-radius: 16px;
  padding: 22px 28px;
  margin-bottom: 28px;
  position: relative;
  overflow: hidden;
}
.welcome-bar::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 4px; height: 100%;
  background: linear-gradient(180deg, var(--gold), var(--gold-light));
}
.welcome-bar h1 {
  color: var(--text);
  font-size: 1.5rem;
  margin: 0 0 6px;
  font-weight: 800;
}
.welcome-bar p {
  color: var(--text-mute);
  margin: 0;
  font-size: 0.9rem;
}
.welcome-actions {
  display: flex;
  gap: 10px;
}
.btn-glow {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: #1A1F2B !important;
  font-weight: 700;
  padding: 10px 20px;
  border-radius: 10px;
  text-decoration: none !important;
  transition: all .25s;
  box-shadow: 0 4px 14px rgba(201,168,76,0.3);
  font-size: 0.9rem;
}
.btn-glow:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(201,168,76,0.5);
}
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-2);
  color: var(--text-mute) !important;
  padding: 10px 20px;
  border-radius: 10px;
  text-decoration: none !important;
  font-weight: 600;
  transition: all .25s;
  font-size: 0.9rem;
}
.btn-ghost:hover {
  border-color: var(--gold);
  color: var(--gold) !important;
}

/* بطاقات إحصائيات محسَّنة */
.aqari-stat .trend {
  position: absolute;
  top: 18px;
  left: 18px;
  font-size: 0.7rem;
  color: var(--gold-light);
  background: rgba(201,168,76,0.1);
  padding: 4px 8px;
  border-radius: 12px;
  font-weight: 700;
}
.aqari-stat .stars {
  position: relative;
  width: 100%;
  height: 4px;
  background: rgba(255,255,255,0.05);
  border-radius: 4px;
  margin-top: 10px;
}
.aqari-stat .star-fill {
  position: absolute;
  top: 0; right: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  border-radius: 4px;
}
.aqari-stat .badge-pulse {
  position: absolute;
  bottom: 18px;
  left: 18px;
  background: var(--danger);
  color: #FFF;
  font-size: 0.7rem;
  padding: 4px 10px;
  border-radius: 12px;
  font-weight: 700;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.aqari-stat.blue::before { background: var(--accent); }
.aqari-stat.has-chart .stat-content { padding-bottom: 12px; }

/* مخططات */
.charts-row {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 18px;
  margin-bottom: 28px;
}
.chart-card {
  background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
}
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.chart-header h3 {
  color: var(--gold-light);
  font-size: 1rem;
  margin: 0;
  font-weight: 700;
}
.chart-tag {
  background: rgba(201,168,76,0.1);
  color: var(--gold);
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.3px;
}

/* مخطط شريطي */
.bars-chart {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.bar-row {
  display: grid;
  grid-template-columns: 100px 1fr;
  align-items: center;
  gap: 14px;
}
.bar-label {
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 600;
  text-align: right;
}
.bar-wrap {
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  overflow: hidden;
  height: 32px;
  position: relative;
}
.bar {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-light), var(--gold));
  border-radius: 8px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  min-width: 40px;
  transition: width .8s ease-out;
}
.bar-value {
  color: #1A1F2B;
  font-weight: 700;
  font-size: 0.85rem;
}

/* قائمة مرقَّمة */
.ranked-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.ranked-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.ranked-list li:last-child { border-bottom: none; }
.ranked-list .rank {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  color: #1A1F2B;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 0.85rem;
  flex-shrink: 0;
}
.ranked-list .rank-content { flex: 1; min-width: 0; }
.ranked-list .rank-title {
  color: var(--gold-light) !important;
  font-weight: 600;
  font-size: 0.88rem;
  text-decoration: none !important;
  display: block;
}
.ranked-list .rank-title:hover { color: var(--gold) !important; }
.ranked-list .rank-meta {
  color: var(--text-dim);
  font-size: 0.72rem;
  margin-top: 2px;
}
.ranked-list .rank-value {
  color: var(--text-mute);
  font-size: 0.8rem;
  font-weight: 700;
  background: rgba(255,255,255,0.04);
  padding: 4px 10px;
  border-radius: 12px;
}

/* إجراءات سريعة */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin: 28px 0;
}
.quick-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  text-decoration: none !important;
  transition: all .25s;
}
.quick-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  border-color: var(--border-2);
}
.qa-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}
.qa-title {
  color: var(--text);
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 2px;
}
.qa-sub {
  color: var(--text-dim);
  font-size: 0.78rem;
}

@media (max-width: 920px) {
  .welcome-bar { flex-direction: column; align-items: stretch; gap: 14px; }
  .welcome-actions { flex-direction: row; }
  .charts-row { grid-template-columns: 1fr; }
}
</style>
