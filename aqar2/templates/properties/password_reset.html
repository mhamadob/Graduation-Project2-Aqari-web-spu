{% extends 'base.html' %}
{% block title %}استعادة كلمة المرور — عقار{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="form-card mx-auto" style="max-width:500px">
    <div class="text-center mb-4">
      <div class="reset-icon">🔑</div>
      <h2 class="form-title">استعادة كلمة المرور</h2>
      <p class="text-muted">أدخل بريدك الإلكتروني المسجَّل وسنرسل لك تعليمات لإعادة تعيين كلمة المرور</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">📧 البريد الإلكتروني</label>
        <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3">📤 إرسال تعليمات الاستعادة</button>
    </form>

    <div class="text-center">
      <a href="{% url 'login' %}" class="text-muted">← العودة لتسجيل الدخول</a>
    </div>
  </div>
</div>
<style>
.form-card{background:linear-gradient(135deg,#1A1F2B,#252A38);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:36px;color:#E8E8EC}
.form-title{color:#C9A84C;font-weight:800;margin:0 0 8px}
.form-card .form-label{color:#C9A84C;font-weight:600}
.form-card .form-control{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.1);color:#E8E8EC;border-radius:8px;padding:12px 14px}
.form-card .form-control:focus{border-color:#C9A84C;box-shadow:0 0 0 3px rgba(201,168,76,0.15)}
.reset-icon{font-size:4rem;margin-bottom:16px}
</style>
{% endblock %}
