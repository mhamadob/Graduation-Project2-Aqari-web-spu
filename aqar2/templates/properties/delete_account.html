{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">
    <div class="card shadow p-4 text-center border-danger">
        <h3 class="text-danger">⚠️ حذف الحساب</h3>
        <p class="text-muted">سيتم حذف حسابك وجميع إعلاناتك نهائياً</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'profile' %}" class="btn btn-secondary me-2">إلغاء</a>
            <button class="btn btn-danger">نعم، احذف حسابي</button>
        </form>
    </div>
</div>
</div>

{% endblock %}
