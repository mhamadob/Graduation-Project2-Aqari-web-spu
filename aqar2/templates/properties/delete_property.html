{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
<div class="col-md-6">
    <div class="card shadow p-4 text-center">
        <h3 class="text-danger">🗑️ حذف العقار</h3>
        <p>هل أنت متأكد من حذف: <strong>{{ property.title }}</strong>؟</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'profile' %}" class="btn btn-secondary me-2">إلغاء</a>
            <button class="btn btn-danger">نعم، احذف</button>
        </form>
    </div>
</div>
</div>

{% endblock %}
